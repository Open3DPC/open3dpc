# Stages the npm packages `open3dpc` and then `open3dpc-cli` when a tag vX.Y.Z is pushed, through npm's
# trusted publishing: no token is stored here. Each package is linked on npmjs.com to this repository and
# this workflow, stage-only: a staged version goes out once the maintainer approves it on npmjs.com with
# his security key. The tag must match both package.json files.
name: npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag is the version in both package.json files
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "v$(node -p "require('./cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: cli/test/run.sh
      - name: npm with staged publishing
        run: npm install -g npm@^11.15.0
      - run: npm stage publish --access public
      - run: npm stage publish --access public
        working-directory: cli
