name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: generator
      - name: The npm package and its TypeScript types
        run: generator/test/types/check.sh
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew --no-daemon :open3dpc:build
        working-directory: kotlin
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test
