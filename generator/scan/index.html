<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111413">
<title>Open3DPC scanner</title>
<meta name="description" content="Scan Open3DPC codes with your phone's camera, in the browser. Nothing to install, nothing uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M0 0h12v12H0z'/%3E%3Cpath fill='%23fff' d='M1 1h10v10H1z'/%3E%3Cpath d='M1 1h2v2H1zM8 6h2v4H6V8h2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="scan.css">
</head>
<body>
<main id="scanner" data-state="idle">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still" hidden aria-hidden="true"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div class="finder" id="finder" aria-hidden="true"><i></i></div>

  <header><a href="../">Open3DPC</a><a href="../">Make a code</a></header>

  <section class="welcome" id="welcome">
    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0h12v12H0zM1 1v10h10V1z" fill-rule="evenodd"/><path d="M1 1h2v2H1zM8 6h2v4H6V8h2z"/></svg>
    <h1>Scan an Open3DPC code</h1>
    <p id="message">Pictures are read on this device and never sent anywhere.</p>
    <button id="start" class="primary">Start the camera</button>
    <label class="file">Read a photo<input id="photo" type="file" accept="image/*"></label>
    <div class="phone" data-phone></div>
    <div class="phone try"><div class="phone-qr" id="sample"></div><div class="phone-text"><h2>Then scan this one</h2><p>An Open3DPC code, here on the screen. Your phone should say 4242.</p></div></div>
  </section>

  <p class="hint" id="hint">Fit the code inside the square</p>
  <div class="tools" id="tools" hidden>
    <button id="torch" hidden aria-pressed="false">Light</button>
    <button id="zoom" hidden>2×</button>
  </div>

  <section class="result" id="result" role="status" aria-live="polite" hidden>
    <div id="picture"></div>
    <div><p class="label">Number</p><p class="value" id="value"></p><p class="facts" id="facts"></p></div>
    <div class="buttons"><button id="copy">Copy</button><button id="again" class="primary">Scan again</button></div>
  </section>
</main>
<script type="module" src="scan.js"></script>
</body>
</html>
