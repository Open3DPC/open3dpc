    <h1>Scan an Open3DPC code</h1>
    <p id="message">Pictures are read on this device and never sent anywhere.</p>
    <button id="start" class="primary">Start the camera</button>
    <label class="file">Read a photo<input id="photo" type="file" accept="image/*"></label>
    <div class="phone" data-phone></div>
    <div class="phone try"><div class="phone-qr" id="sample"></div><div class="phone-text"><h2>Then scan this one</h2><p>An Open3DPC code, here on the screen. Your phone should say 4242.</p></div></div>
  </section>

  <p class="hint" id="hint">Fit the code inside the square</p>
  <div class="tools" id="tools" hidden>
    <button id="torch" hidden aria-pressed="false">Light</button>
    <button id="zoom" hidden>2×</button>
  </div>

  <section class="result" id="result" role="status" aria-live="polite" hidden>
    <div id="picture"></div>
    <div><p class="label">Number</p><p class="value" id="value"></p><p class="facts" id="facts"></p></div>
    <div class="buttons"><button id="copy">Copy</button><button id="again" class="primary">Scan again</button></div>
  </section>
</main>
