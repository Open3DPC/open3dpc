" height="56" fill="#e5e7eb" /><text x="200" y="323" text-anchor="middle" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#111">×</text><rect x="228" y="288" width="56" height="56" fill="#e5e7eb" /><text x="256" y="323" text-anchor="middle" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#111">×</text><rect x="284" y="288" width="56" height="56" fill="#e5e7eb" /><text x="312" y="323" text-anchor="middle" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#111">×</text><rect x="340" y="288" width="56" height="56" fill="#e5e7eb" /><text x="368" y="323" text-anchor="middle" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#111">×</text><rect x="396" y="288" width="56" height="56" fill="#7e22ce" /><text x="424" y="323" text-anchor="middle" font-size="20" font-family="ui-monospace, Menlo, monospace" fill="#fff">1</text><rect x="570" y="49" width="16" height="16" fill="#8a918e" rx="3"/><text x="598" y="62" font-size="17" font-weight="600" fill="#15191a">Quiet zone</text><text x="598" y="82" font-size="14" fill="#5d6562">at least M/2 of contrasting background</text><rect x="570" y="103" width="16" height="16" fill="#111" rx="3"/><text x="598" y="116" font-size="17" font-weight="600" fill="#15191a">Frame</text><text x="598" y="136" font-size="14" fill="#5d6562">one closed line, M/2 wide</text><rect x="570" y="157" width="16" height="16" fill="#111" rx="3"/><text x="598" y="170" font-size="17" font-weight="600" fill="#15191a">Orientation</text><text x="598" y="190" font-size="14" fill="#5d6562">the one square joined to the frame</text><rect x="570" y="211" width="16" height="16" fill="#1d4ed8" rx="3"/><text x="598" y="224" font-size="17" font-weight="600" fill="#15191a">Payload</text><text x="598" y="244" font-size="14" fill="#5d6562">14 bits: 9999</text><rect x="570" y="265" width="16" height="16" fill="#15803d" rx="3"/><text x="598" y="278" font-size="17" font-weight="600" fill="#15191a">Terminator</text><text x="598" y="298" font-size="14" fill="#5d6562">always 1, ends the payload</text><rect x="570" y="319" width="16" height="16" fill="#c3c7cc" rx="3"/><text x="598" y="332" font-size="17" font-weight="600" fill="#15191a">Padding</text><text x="598" y="352" font-size="14" fill="#5d6562">zeroes</text><rect x="570" y="373" width="16" height="16" fill="#7e22ce" rx="3"/><text x="598" y="386" font-size="17" font-weight="600" fill="#15191a">Checksum</text><text x="598" y="406" font-size="14" fill="#5d6562">last column, top to bottom</text><path d="M60 452h56" stroke="#5d6562" stroke-width="2"/><path d="M60 447v10M116 447v10" stroke="#5d6562" stroke-width="2"/><text x="88" y="476" text-anchor="middle" font-size="14" fill="#5d6562">M</text><text x="132" y="457" font-size="14" fill="#5d6562">1.6 mm by default, so the code is 12.8 × 9.6 mm</text></svg>
